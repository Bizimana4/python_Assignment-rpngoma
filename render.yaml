services:
  - type: web
    name: crop-recommendation-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GRADIO_SERVER_NAME
        value: 0.0.0.0